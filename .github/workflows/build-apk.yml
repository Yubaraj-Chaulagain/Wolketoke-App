
name: Build Wolketoke Hybrid Multi-Hop APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build, Verify and Release APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

      # 1. Checkout Source
      - name: Checkout Source
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 4. Configure Android SDK
      - name: Configure Android SDK
        run: |
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/35.0.0" >> $GITHUB_PATH

          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME"

      # 5. Install Android SDK Packages
      - name: Install Android SDK Packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 6. Accept Licenses
      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      # 7. Validate Project
      - name: Validate Project
        run: |
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/yubaraj/walkietalkie/MainActivity.java

      # 8. Build APK
      - name: Build Debug APK
        run: |
          gradle --no-daemon clean assembleDebug

      # 9. Verify APK
      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "APK not found!"
            exit 1
          fi

          echo "APK BUILD SUCCESSFUL"

          ls -lh "$APK"
          sha256sum "$APK"

      # 10. Upload APK Artifact
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wolketoke-Hybrid-MultiHop-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # 11. Create or Update GitHub Release
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Wolketoke Walkie-Talkie APK Build ${{ github.run_number }}

          body: |
            Wolketoke Hybrid Multi-Hop Android APK

            Build Number: ${{ github.run_number }}

            Commit: ${{ github.sha }}

            APK: app-debug.apk

            Download and install on your Android device.

          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
          fail_on_unmatched_files: true

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 12. Upload Build Reports
      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Wolketoke-Build-Reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
