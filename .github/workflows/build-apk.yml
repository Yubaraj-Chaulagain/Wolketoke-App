name: Build Wolketoke 50 Device Multi-Hop Relay APK - Release

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          accept-android-sdk-licenses: true

      # 4. Install SDK Packages
      - name: Install Android SDK Packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 6. Check Project
      - name: Validate Project Files
        run: |
          test -d app
          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties

          echo "Project files verified."

      # 7. Clean
      - name: Clean Project
        run: gradle clean

      # 8. Build RELEASE APK
      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      # 9. Verify RELEASE APK
      - name: Verify APK
        run: |
          APK=$(find app/build/outputs/apk/release \
            -name "*.apk" -type f | head -n 1)

          if [ -z "$APK" ]; then
            echo "RELEASE APK NOT FOUND"
            exit 1
          fi

          echo "Release APK successfully created: $APK"

          mkdir -p release
          cp "$APK" release/Wolketoke-Relay.apk

      # 10. Upload Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wolketoke-50-Device-Relay-APK
          path: release/Wolketoke-Relay.apk
          retention-days: 30

      # 11. Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Wolketoke Walkie-Talkie APK Release ${{ github.run_number }}
          body: |
            Wolketoke Hybrid Multi-Hop Android APK

            Build Number: ${{ github.run_number }}
            Version: 1.9
            Version Code: 9

            Java: 17
            Gradle: 8.7
            Android SDK: 35

            APK: Wolketoke-Relay.apk

            Download and install on your Android device.
          files: release/Wolketoke-Relay.apk
          fail_on_unmatched_files: true
          make_latest: true

      # 12. Success Summary
      - name: Build Summary
        if: success()
        run: |
          echo "## APK BUILD SUCCESSFUL" >> $GITHUB_STEP_SUMMARY
          echo "New RELEASE APK created." >> $GITHUB_STEP_SUMMARY
          echo "Build: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "Version: 1.9" >> $GITHUB_STEP_SUMMARY
          echo "Version Code: 9" >> $GITHUB_STEP_SUMMARY

      # 13. Failure Summary
      - name: Build Failure Summary
        if: failure()
        run: |
          echo "## APK BUILD FAILED" >> $GITHUB_STEP_SUMMARY
          echo "Check failed step in Actions logs." >> $GITHUB_STEP_SUMMARY
