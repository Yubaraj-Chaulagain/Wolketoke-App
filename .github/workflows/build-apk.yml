name: Build Wolketoke 50 Device Multi-Hop Relay APK - Release

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK
      # Do NOT specify cmdline-tools-version here.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Accept Android SDK Licenses
      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      # 5. Install Required Android SDK Packages
      - name: Install Android SDK Packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 6. Check Android SDK
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --list | head -n 50

      # 7. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 8. Validate Project Files
      - name: Validate Project Files
        run: |
          test -d app
          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties

          echo "Project files verified successfully."

      # 9. Show App Version
      - name: Show App Version
        run: |
          echo "Checking app/build.gradle..."
          grep -n "versionCode\|versionName" app/build.gradle || true

      # 10. Clean Project
      - name: Clean Project
        run: |
          gradle clean --stacktrace

      # 11. Build RELEASE APK
      - name: Build Release APK
        run: |
          gradle assembleRelease --stacktrace

      # 12. Verify RELEASE APK
      - name: Verify APK
        run: |
          echo "Searching for Release APK..."

          APK=$(find app/build/outputs/apk/release \
            -name "*.apk" \
            -type f \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: RELEASE APK NOT FOUND"
            echo "Available APK files:"
            find app/build/outputs -name "*.apk" -type f || true
            exit 1
          fi

          echo "Release APK found:"
          echo "$APK"

          mkdir -p release

          cp "$APK" release/Wolketoke-Relay.apk

          echo "APK copied successfully."

      # 13. Show APK Information
      - name: APK Information
        run: |
          ls -lh release/Wolketoke-Relay.apk
          file release/Wolketoke-Relay.apk

      # 14. Upload APK Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wolketoke-50-Device-Relay-APK
          path: release/Wolketoke-Relay.apk
          retention-days: 30

      # 15. Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Wolketoke Walkie-Talkie APK Release ${{ github.run_number }}
          body: |
            Wolketoke Hybrid Multi-Hop Android APK

            Build Number: ${{ github.run_number }}
            Version: 1.9
            Version Code: 9

            Java: 17
            Gradle: 8.7
            Android SDK: 35

            APK: Wolketoke-Relay.apk

            This is a RELEASE APK.

            Download and install on your Android device.
          files: release/Wolketoke-Relay.apk
          fail_on_unmatched_files: true
          make_latest: true

      # 16. Success Summary
      - name: Build Summary
        if: success()
        run: |
          echo "## APK BUILD SUCCESSFUL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Wolketoke Release APK created successfully." >> $GITHUB_STEP_SUMMARY
          echo "Build Number: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "Version: 1.9" >> $GITHUB_STEP_SUMMARY
          echo "Version Code: 9" >> $GITHUB_STEP_SUMMARY
          echo "APK: Wolketoke-Relay.apk" >> $GITHUB_STEP_SUMMARY

      # 17. Failure Summary
      - name: Build Failure Summary
        if: failure()
        run: |
          echo "## APK BUILD FAILED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the failed step above for the exact error." >> $GITHUB_STEP_SUMMARY
