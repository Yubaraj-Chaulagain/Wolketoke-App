
name: Build Wolketoke Hybrid Multi-Hop APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and Verify APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Use preinstalled Android SDK
      - name: Configure Android SDK
        run: |
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/35.0.0" >> $GITHUB_PATH

          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME"

      # Install SDK without setup-android action
      - name: Install Android SDK Packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Validate Project
        run: |
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/yubaraj/walkietalkie/MainActivity.java

      - name: Build Debug APK
        run: |
          gradle --no-daemon clean assembleDebug

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK Build Successful"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Wolketoke-Hybrid-MultiHop-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Wolketoke-Build-Reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
