name: Build Wolketoke 50 Device Multi-Hop Relay APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check Android SDK
        run: |
          echo "Checking Android SDK..."
          ls -la "$ANDROID_HOME"

          echo "Available platforms:"
          ls "$ANDROID_HOME/platforms" || true

          echo "Available build tools:"
          ls "$ANDROID_HOME/build-tools" || true

      - name: Install Required SDK Components
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)

          echo "Using SDK Manager: $SDKMANAGER"

          if [ -z "$SDKMANAGER" ]; then
            echo "SDK Manager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Check Project Files
        run: |
          echo "Checking project structure..."

          ls -la

          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -d app

          echo "Project structure OK"

      - name: Clean Project
        run: gradle clean

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" -type f | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi

          echo "APK found: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wolketoke-50-Device-Relay-Debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Summary
        if: success()
        run: |
          echo "## APK Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "Wolketoke APK successfully built." >> $GITHUB_STEP_SUMMARY

      - name: Build Failure Summary
        if: failure()
        run: |
          echo "## APK Build Failed" >> $GITHUB_STEP_SUMMARY
          echo "Check the failed step in Actions logs." >> $GITHUB_STEP_SUMMARY
