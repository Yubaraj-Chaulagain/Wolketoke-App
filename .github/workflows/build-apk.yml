name: Build Wolketoke 50 Device Multi-Hop Relay APK - Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Install Required Android SDK Packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validate Project Files
        run: |
          test -d app
          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          echo "Project files verified."

      - name: Show App Version
        run: |
          grep -n "versionCode\|versionName\|targetSdk" app/build.gradle

      - name: Clean Project
        run: gradle clean --stacktrace

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Verify Release APK
        run: |
          APK=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: RELEASE APK NOT FOUND"
            find app/build/outputs -type f -name "*.apk" || true
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/Wolketoke-Relay.apk
          ls -lh release/Wolketoke-Relay.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wolketoke-50-Device-Relay-APK
          path: release/Wolketoke-Relay.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Wolketoke Walkie-Talkie APK Release ${{ github.run_number }}

          body: |
            Wolketoke Hybrid Multi-Hop Android APK

            Build Number: ${{ github.run_number }}
            Version: 1.10
            Version Code: 10
            Target SDK: 35
            Android SDK: 35
            Build Type: RELEASE

            APK: Wolketoke-Relay.apk

          files: release/Wolketoke-Relay.apk
          fail_on_unmatched_files: true
          make_latest: true

      - name: Build Summary
        if: success()
        run: |
          echo "## APK BUILD SUCCESSFUL" >> $GITHUB_STEP_SUMMARY
          echo "Version: 1.10" >> $GITHUB_STEP_SUMMARY
          echo "Version Code: 10" >> $GITHUB_STEP_SUMMARY
          echo "Target SDK: 35" >> $GITHUB_STEP_SUMMARY

      - name: Build Failure Summary
        if: failure()
        run: |
          echo "## APK BUILD FAILED" >> $GITHUB_STEP_SUMMARY
          echo "Check the failed step above for the exact error." >> $GITHUB_STEP_SUMMARY
