name: Build Wolketoke 50 Device Multi-Hop Relay APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK Components
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Check Project Files
        run: |
          echo "Checking project structure..."
          ls -la
          test -f settings.gradle || test -f settings.gradle.kts
          test -f gradlew
          test -d app

      - name: Grant Gradle Permission
        run: chmod +x ./gradlew

      - name: Clean Project
        run: ./gradlew clean

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        run: |
          find app/build/outputs/apk -name "*.apk" -type f
          test -n "$(find app/build/outputs/apk -name "*.apk" -type f)"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Wolketoke-50-Device-Relay-Debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Summary
        if: success()
        run: |
          echo "## Wolketoke APK Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "Wi-Fi and Bluetooth Relay source build completed." >> $GITHUB_STEP_SUMMARY
          echo "Download APK from Actions Artifacts." >> $GITHUB_STEP_SUMMARY

      - name: Build Failure Summary
        if: failure()
        run: |
          echo "## APK Build Failed" >> $GITHUB_STEP_SUMMARY
          echo "Please check the failed step in the Actions logs." >> $GITHUB_STEP_SUMMARY
