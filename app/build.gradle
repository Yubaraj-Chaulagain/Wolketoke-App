plugins { id 'com.android.application' }
android {
    namespace 'com.yubaraj.walkietalkie'
    compileSdk 35
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId 'com.yubaraj.walkietalkie'
        minSdk 26
        targetSdk 32
        versionCode 4
        versionName '1.4-school-bell-safe'
    }
}


dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
