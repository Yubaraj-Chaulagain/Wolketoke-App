plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yubaraj.walkietalkie'

    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId 'com.yubaraj.walkietalkie'

        minSdk 26
        targetSdk 35

        versionCode 9
        versionName '1.9'
    }

    buildTypes {
        debug {
            debuggable true
        }

        release {
            minifyEnabled false

            // Release APK signing
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {

    // Android WebKit
    implementation 'androidx.webkit:webkit:1.12.1'

}
